name: Publicar no Instagram

on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC = 09:00 em Sao Paulo
  workflow_dispatch:        # permite rodar manualmente

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Publicar post do dia
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python publicar.py

      - name: Mover post publicado para postados/
        run: |
          git config user.name "instagram-agent"
          git config user.email "instagram-agent@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Post publicado" && git push)
